# Full stack in containers: PostgreSQL, a one-shot data pipeline, the API and the web app.
#
#   cp .env.example .env     # then set POSTGRES_PASSWORD
#   docker compose up --build
#   open http://localhost:8080
#
# Verified on 2026-11-12 with Docker Desktop 29 / Compose v5 on macOS (arm64): the three
# images build, the pipeline loads the warehouse, the API reports healthy and the web app
# serves on :8080. The end-to-end suite passes against this stack (see docs/TESTING.md).
# Re-running `docker compose up` on an existing volume reloads the warehouse (the ETL
# truncates and reloads) and keeps the audit history.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-fi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Migrates the schema, generates the synthetic extracts and loads the warehouse, then exits.
  pipeline:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment: &database-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-financial_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-fi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: >
      sh -c "alembic upgrade head
      && python -m pipelines.generate
      && python -m pipelines.etl"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *database-env
      API_CORS_ORIGINS: http://localhost:8080
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
