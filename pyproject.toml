[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intelligence"
version = "0.1.0"
description = "Financial intelligence and budget control analytics platform (synthetic data)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = [
    "B008", # FastAPI dependency injection uses call expressions in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL instance loaded by the ETL pipeline",
]

[tool.mypy]
python_version = "3.12"
packages = ["backend", "pipelines"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# numpy and pandas expressions evaluate to Any; flagging every such return adds only noise.
warn_return_any = false

# pandas ships no inline types and its third-party stubs reject most idiomatic indexing,
# so data frames are treated as untyped; everything around them is checked strictly.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend", "pipelines"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
