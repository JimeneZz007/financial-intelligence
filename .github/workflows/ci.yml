# Continuous integration: the same checks as `make ci` (scripts/ci_local.sh).
#
# STATUS: prepared locally. It has not run on GitHub because the repository is not
# published yet; the equivalent local script is the verified path.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_DB: financial_intelligence
  POSTGRES_TEST_DB: financial_intelligence_test
  POSTGRES_USER: fi_app
  # Throwaway credential for the ephemeral CI database; not used anywhere else.
  POSTGRES_PASSWORD: ci_only_password

jobs:
  backend:
    name: Python - lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: financial_intelligence
          POSTGRES_USER: fi_app
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fi_app"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Create the test database
        run: PGPASSWORD="$POSTGRES_PASSWORD" createdb -h 127.0.0.1 -U "$POSTGRES_USER" "$POSTGRES_TEST_DB"
      - name: Build the warehouse (generate, migrate, load)
        run: |
          python -m pipelines.generate
          alembic upgrade head
          python -m pipelines.etl
      - name: Tests with coverage
        run: pytest --cov
      - name: Independent SQL validation
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from sqlalchemy import text
          from backend.app.db.session import build_engine
          from backend.app.db.validation import parse_named_queries

          queries = parse_named_queries(Path("database/sql/validation_queries.sql").read_text("utf-8"))
          with build_engine().connect() as connection:
              failed = [name for name, sql in queries.items() if connection.execute(text(sql)).fetchall()]
          print(f"{len(queries) - len(failed)}/{len(queries)} validation queries passed")
          sys.exit(1 if failed else 0)
          PY

  frontend:
    name: Web - lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: financial_intelligence
          POSTGRES_USER: fi_app
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fi_app"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
          npm --prefix frontend ci
          npm --prefix frontend exec playwright install --with-deps chromium
      - name: Build the warehouse
        run: |
          .venv/bin/python -m pipelines.generate
          .venv/bin/alembic upgrade head
          .venv/bin/python -m pipelines.etl
      - name: End-to-end tests
        run: npm --prefix frontend run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
